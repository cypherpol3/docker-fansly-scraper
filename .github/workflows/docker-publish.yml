name: Docker Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

env:
  IMAGE_NAME: cypherpol3/docker-fansly-scraper
  UPSTREAM_REPOSITORY: agnosto/fansly-scraper

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_JSON="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/releases/latest")"

          TAG="$(echo "${RELEASE_JSON}" | jq -r '.tag_name')"

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "Could not determine upstream release."
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Latest upstream release: ${TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether version already exists
        id: image
        run: |
          if docker buildx imagetools inspect \
            "${IMAGE_NAME}:${{ steps.upstream.outputs.version }}" \
            >/dev/null 2>&1; then

            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Image already exists."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Image does not exist yet."
          fi

      - name: Set up QEMU
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        if: steps.image.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}

      - name: Build and push
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            FANSLY_SCRAPER_VERSION=${{ steps.upstream.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max