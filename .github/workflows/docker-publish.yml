name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if the upstream version already exists"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

env:
  IMAGE_NAME: cypherpol3/docker-fansly-scraper
  UPSTREAM_REPOSITORY: agnosto/fansly-scraper

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_JSON="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/releases/latest")"

          TAG="$(echo "${RELEASE_JSON}" | jq -r '.tag_name')"

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "Could not determine latest stable upstream release."
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Latest stable upstream release: ${TAG}"
          echo "Docker version tag: ${VERSION}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether version already exists
        id: image
        run: |
          if docker manifest inspect \
            "${IMAGE_NAME}:${{ steps.upstream.outputs.version }}" \
            >/dev/null 2>&1; then

            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Image ${IMAGE_NAME}:${{ steps.upstream.outputs.version }} already exists."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Image ${IMAGE_NAME}:${{ steps.upstream.outputs.version }} does not exist."
          fi

      - name: Decide whether to build
        id: decision
        env:
          IMAGE_EXISTS: ${{ steps.image.outputs.exists }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          if [ "${FORCE_REBUILD}" = "true" ]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "Force rebuild requested."
          elif [ "${IMAGE_EXISTS}" != "true" ]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "New upstream version detected."
          else
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "Nothing to build."
          fi

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: fansly-scraper:test
          build-args: |
            FANSLY_SCRAPER_VERSION=${{ steps.upstream.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run entrypoint tests
        if: steps.decision.outputs.build == 'true'
        run: |
          python3 tests/entrypoint_errors.py --image fansly-scraper:test

      - name: Set up QEMU
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Docker metadata
        if: steps.decision.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }},priority=900
            type=raw,value=latest,priority=100

          labels: |
            org.opencontainers.image.title=docker-fansly-scraper
            org.opencontainers.image.description=Docker image for agnosto/fansly-scraper
            org.opencontainers.image.url=https://github.com/cypherpol3/docker-fansly-scraper
            org.opencontainers.image.source=https://github.com/cypherpol3/docker-fansly-scraper

      - name: Build and push
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          build-args: |
            FANSLY_SCRAPER_VERSION=${{ steps.upstream.outputs.tag }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max